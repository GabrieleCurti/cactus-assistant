name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components (API 35, Build Tools 35.0.0, NDK 27.2.12479018, CMake 3.22.1)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Download Cactus Compute engine and .cact weights
        run: ./scripts/download_cactus.sh

      - name: Run unit tests and assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk CactusAssistant-debug.apk

      - name: Upload CactusAssistant-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: CactusAssistant-debug
          path: CactusAssistant-debug.apk
          if-no-files-found: error
